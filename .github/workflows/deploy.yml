name: CI — Test, Build & Validate

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Validate Showcase (Vue App) ──────────────────────────────────────
  validate-showcase:
    name: Showcase — Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests (showcase)
        run: pnpm --filter @nala/showcase test:run

      - name: TypeScript Check & Build (showcase)
        run: pnpm --filter @nala/showcase build

  # ─── Job 2: Validate create-nala CLI ─────────────────────────────────────────
  validate-cli:
    name: create-nala CLI — Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI (tsup)
        run: pnpm --filter create-nala build

      - name: Smoke test — scaffold a new project
        run: node packages/create-nala/dist/index.js ci-test-project --force

      - name: Clean up scaffolded test output
        run: rm -rf ci-test-project

  # ─── Job 3: Publish create-nala to npm (on version tag) ──────────────────────
  publish-cli:
    name: Publish create-nala to npm
    runs-on: ubuntu-latest
    needs: [validate-showcase, validate-cli]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter create-nala build

      - name: Publish to npm
        run: pnpm --filter create-nala publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
