# Cloudflare configuration for @nala/showcase
# Supports both Cloudflare Workers & Cloudflare Pages deployments

name = "nala"
compatibility_date = "2026-08-27"

# Pages output directory
pages_build_output_dir = "./dist"

# Workers Static Assets directory & SPA routing
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
